<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Chiribi Studios</title>
  <link rel="stylesheet" href="store.css">
</head>
<body data-page="login">
  <div id="siteHeader"></div>
  <main>
    <div class="center">
      <div class="box">
        <h1>Entra a Chiribi</h1>
        <p>Inicia sesión para guardar tu colección.</p>
        <button class="google" id="googleBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.8-3.1-11.3-7.8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3.1 5.4-5.9 6.9l6.6 5.4C39.8 37.1 44 31.1 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg> Continuar con Google</button>
      </div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <div id="toast" role="status"></div>
  <dialog id="googleDialog">
    <h2>Elige una cuenta</h2>
    <p class="note sim"></p>
    <button class="account" id="demoAccount"><span class="avatar" id="demoAvatar"></span><span><b id="demoName"></b><small id="demoMail"></small></span></button>
    <button class="account" id="otherBtn"><span class="avatar">+</span><span><b>Usar otra cuenta</b></span></button>
    <form class="form" id="otherForm" novalidate hidden>
      <label>Nombre<input id="otherName" autocomplete="off" placeholder="Tu nombre"></label>
      <label>Correo<input id="otherMail" type="email" autocomplete="off" placeholder="tucorreo@ejemplo.com"></label>
      <small class="err" id="otherErr"></small>
      <button class="btn big full">Continuar</button>
    </form>
    <div class="row"><button class="btn ghost big" id="googleCancel">Cancelar</button></div>
  </dialog>
  <script src="store.js"></script>
</body>
</html>
