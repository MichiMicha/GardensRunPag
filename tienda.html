<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chiribi Studios</title>
  <link rel="stylesheet" href="store.css">
</head>
<body data-page="tienda">
  <div id="siteHeader"></div>
  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <p>Producto Estrella · Garden's Run</p>
          <h1>Entra a Chiribi</h1>
          <p>Juegos, cómics y mercancía.</p>
          <a class="btn big" href="index.html">Explorar Garden's Run</a>
        </div>
        <img src="images/logo-gardens-run.png" alt="Garden's Run">
      </section>

      <section class="section">
        <h2>Entradas</h2>
        <div class="doors">
          <a class="door" style="background:var(--tan)" href="productos.html#juegos"><img src="images/logo-gardens-run.png" alt=""><h3>Catálogo completo</h3></a>
          <a class="door" style="background:var(--sage)" href="productos.html#expansiones"><img src="images/cover-gardens-run.png" alt=""><h3>Cómics</h3></a>
          <a class="door mug" style="background:#ece6e6" href="mercancia.html"><img src="images/merch-taza.png" alt=""><h3>Mercancía</h3></a>
        </div>
      </section>

      <section class="section">
        <h2>Novedades</h2>
        <div class="grid" id="novedades"></div>
      </section>

      <section class="section">
        <h2>Producto Estrella</h2>
        <div class="feature">
          <div class="thumb"><img src="images/logo-gardens-run.png" alt=""></div>
          <div>
            <h3>Garden's Run</h3>
            <p class="note">¿Qué pasa cuando tu cena cobra vida y sale corriendo?</p>
            <a class="btn big" href="index.html">Más información</a>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="siteFooter"></div>
  <div id="toast" role="status"></div>
  <script src="store.js"></script>
</body>
</html>
