<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden's Run — Chiribi Studios</title>
  <link rel="stylesheet" href="store.css">
</head>
<body data-page="producto">
  <div id="siteHeader"></div>
  <main>
    <div class="wrap">
      <div class="banner"><img src="images/logo-gardens-run.png" alt="Garden's Run"></div>
      <section class="product">
        <h1>Garden's Run</h1>
        <p class="note" style="font-size:1.25rem">¿Qué pasa cuando tu cena cobra vida y sale corriendo?</p>
        <p class="price" id="productPrice"></p>
        <div class="actions">
          <button class="btn big" id="buyBtn">Comprar</button>
          <a class="btn ghost big" href="index.html">Más información</a>
        </div>
      </section>
      <section class="section" style="padding-top:56px">
        <h2>Contenido relacionado</h2>
        <div class="grid" id="relatedGrid"></div>
      </section>
    </div>
  </main>
  <div id="siteFooter"></div>
  <div id="toast" role="status"></div>
  <script src="store.js"></script>
</body>
</html>
